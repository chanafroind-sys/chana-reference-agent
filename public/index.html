<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שאלו על חנה</title>
<meta name="description" content="223 מקרים מתועדים מעבודה אמיתית של חנה פרוינד. שאלו כל דבר.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Assistant:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F8F9;
    --surface: #FFFFFF;
    --text: #1B2126;
    --text-secondary: #4B555F;
    --text-tertiary: #818C96;
    --border: #DEE3E8;
    --accent: #8A6216;
    --accent-soft: rgba(138, 98, 22, 0.10);
    --error: #B3261E;
    --error-soft: rgba(179, 38, 30, 0.08);

    --font-header: "Frank Ruhl Libre", Georgia, "Times New Roman", serif;
    --font-body: "Assistant", -apple-system, "Segoe UI", Arial, sans-serif;
    --font-mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15181B;
      --surface: #1D2124;
      --text: #E7E9EA;
      --text-secondary: #AEB6BC;
      --text-tertiary: #7C858C;
      --border: #2B3136;
      --accent: #C99A4A;
      --accent-soft: rgba(201, 154, 74, 0.14);
      --error: #E5786A;
      --error-soft: rgba(229, 120, 106, 0.10);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    height: 100%;
  }

  body {
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
  }

  .shell {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    padding: 0 1rem;
  }

  header {
    padding: 1.75rem 0 1.25rem;
    border-bottom: 1px solid var(--border);
  }

  header h1 {
    font-family: var(--font-header);
    font-weight: 900;
    font-size: 1.6rem;
    margin: 0 0 0.4rem;
    letter-spacing: -0.01em;
  }

  header p {
    margin: 0;
    color: var(--text-secondary);
    font-size: 0.95rem;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    padding: 1rem 0;
  }

  .chip {
    font-family: var(--font-body);
    font-size: 0.85rem;
    color: var(--text-secondary);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.5rem 0.9rem;
    cursor: pointer;
    text-align: right;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .chip:hover { border-color: var(--accent); color: var(--text); }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 0.5rem 0 1rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .msg { max-width: 100%; }

  .msg.user {
    align-self: flex-end;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 0.6rem 1rem;
    max-width: 85%;
    font-size: 0.95rem;
    white-space: pre-wrap;
  }

  .msg.assistant {
    font-size: 1rem;
    animation: fade-in 0.3s ease;
  }

  .msg.assistant p {
    margin: 0 0 0.85rem;
    white-space: pre-wrap;
  }

  .msg.assistant p:last-child { margin-bottom: 0; }

  .msg.system {
    color: var(--error);
    background: var(--error-soft);
    border: 1px solid var(--error);
    border-radius: 10px;
    padding: 0.6rem 1rem;
    font-size: 0.9rem;
    align-self: stretch;
  }

  .quote {
    border-inline-start: 3px solid var(--accent);
    background: var(--accent-soft);
    padding: 0.85rem 1.15rem;
    margin: 0.9rem 0;
    font-size: 1.08em;
    border-radius: 2px;
  }

  .inline-quote { color: var(--accent); font-weight: 600; }

  @keyframes fade-in {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .typing {
    display: flex;
    gap: 0.3rem;
    padding: 0.3rem 0;
  }

  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-tertiary);
    animation: bounce 1.2s infinite ease-in-out;
  }

  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .msg.assistant { animation: none; }
    .typing span { animation: none; opacity: 0.7; }
  }

  form {
    display: flex;
    gap: 0.6rem;
    align-items: flex-end;
    padding: 0.9rem 0 1.1rem;
    border-top: 1px solid var(--border);
    background: var(--bg);
  }

  textarea {
    flex: 1;
    resize: none;
    font-family: var(--font-body);
    font-size: 0.98rem;
    line-height: 1.5;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.65rem 0.9rem;
    max-height: 8.5rem;
    min-height: 2.7rem;
  }

  textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  button[type="submit"] {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.95rem;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 12px;
    padding: 0.65rem 1.2rem;
    cursor: pointer;
    height: 2.7rem;
  }

  button[type="submit"]:disabled { opacity: 0.5; cursor: default; }
  button[type="submit"]:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

  .hint {
    text-align: center;
    color: var(--text-tertiary);
    font-family: var(--font-mono);
    font-size: 0.72rem;
    padding-bottom: 0.75rem;
  }

  @media (max-width: 480px) {
    header h1 { font-size: 1.35rem; }
    .msg.user { max-width: 92%; }
  }
</style>
</head>
<body>
  <div class="shell">
    <header>
      <h1>שאלו על חנה</h1>
      <p>223 מקרים מתועדים מעבודה אמיתית. שאלו כל דבר — התשובות מגיעות עם ציטוט.</p>
    </header>

    <div class="chips" id="chips">
      <button class="chip" type="button">איך היא מתמודדת עם באג שלא מובן?</button>
      <button class="chip" type="button">כמה עמוק היא באמת חושבת? תן לי את הרגע הכי אינטלקטואלי.</button>
      <button class="chip" type="button">אני צוות של חמישה בלי QA — היא תשרוד?</button>
      <button class="chip" type="button">מה החולשות שלה?</button>
    </div>

    <main id="chat" aria-live="polite"></main>

    <form id="form">
      <textarea id="input" rows="1" placeholder="שאלו משהו על חנה…" maxlength="600" aria-label="שאלה"></textarea>
      <button type="submit" id="send">שליחה</button>
    </form>
    <div class="hint">Enter לשליחה · Shift+Enter לשורה חדשה</div>
  </div>

<script>
(function () {
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const chips = document.getElementById("chips");

  let history = [];
  let busy = false;

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function inline(line) {
    let s = escapeHtml(line);
    s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/([\"“„][^\"”]{2,}[\"”])/g, '<span class="inline-quote">$1</span>');
    return s;
  }

  function renderAnswer(raw) {
    const lines = raw.split("\n");
    let html = "";
    let quoteBuf = [];
    let paraBuf = [];
    function flushQuote() {
      if (quoteBuf.length) {
        html += '<div class="quote">' + quoteBuf.map(inline).join("<br>") + "</div>";
        quoteBuf = [];
      }
    }
    function flushPara() {
      if (paraBuf.length) {
        html += "<p>" + paraBuf.map(inline).join("<br>") + "</p>";
        paraBuf = [];
      }
    }
    for (const line of lines) {
      const m = line.match(/^>\s?(.*)$/);
      if (m) {
        flushPara();
        quoteBuf.push(m[1]);
      } else if (line.trim() === "") {
        flushQuote();
        flushPara();
      } else {
        flushQuote();
        paraBuf.push(line);
      }
    }
    flushQuote();
    flushPara();
    return html;
  }

  function scrollToBottom() {
    chat.scrollTop = chat.scrollHeight;
  }

  function addUserMessage(text) {
    const el = document.createElement("div");
    el.className = "msg user";
    el.textContent = text;
    chat.appendChild(el);
    scrollToBottom();
  }

  function addSystemMessage(text) {
    const el = document.createElement("div");
    el.className = "msg system";
    el.textContent = text;
    chat.appendChild(el);
    scrollToBottom();
  }

  function addTyping() {
    const el = document.createElement("div");
    el.className = "typing";
    el.id = "typing-indicator";
    el.innerHTML = "<span></span><span></span><span></span>";
    chat.appendChild(el);
    scrollToBottom();
    return el;
  }

  function setBusy(v) {
    busy = v;
    sendBtn.disabled = v;
    input.disabled = v;
    Array.from(chips.children).forEach((c) => (c.disabled = v));
  }

  async function ask(question) {
    if (busy) return;
    setBusy(true);
    addUserMessage(question);

    const typingEl = addTyping();
    let assistantEl = null;
    let acc = "";

    try {
      const res = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, history }),
      });

      if (!res.ok) {
        typingEl.remove();
        let message = "משהו השתבש. נסו שוב בעוד רגע.";
        try {
          const data = await res.json();
          if (data && data.error) message = data.error;
        } catch {}
        addSystemMessage(message);
        setBusy(false);
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let first = true;

      function appendChunk(chunk) {
        if (!chunk) return;
        if (first) {
          typingEl.remove();
          assistantEl = document.createElement("div");
          assistantEl.className = "msg assistant";
          chat.appendChild(assistantEl);
          first = false;
        }
        acc += chunk;
        assistantEl.innerHTML = renderAnswer(acc);
        scrollToBottom();
      }

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        appendChunk(decoder.decode(value, { stream: true }));
      }
      appendChunk(decoder.decode()); // flush trailing multi-byte tail

      if (first) {
        typingEl.remove();
      }

      if (acc.trim()) {
        history.push({ role: "user", content: question });
        history.push({ role: "assistant", content: acc });
        history = history.slice(-16);
      }
    } catch (err) {
      typingEl.remove();
      addSystemMessage("לא הצלחנו להתחבר כרגע. בדקו חיבור ונסו שוב.");
    } finally {
      setBusy(false);
      input.focus();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || busy) return;
    input.value = "";
    input.style.height = "auto";
    ask(text);
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 136) + "px";
  });

  chips.addEventListener("click", (e) => {
    const btn = e.target.closest(".chip");
    if (!btn || busy) return;
    ask(btn.textContent);
  });
})();
</script>
</body>
</html>
