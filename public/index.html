<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הקולגה הדיגיטלית של חנה | AI Agent</title>
<meta name="description" content="223 מקרים מתועדים מעבודה אמיתית של חנה פרוינד. שאלו כל דבר.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Assistant:wght@400;600;700&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070913;
    --surface: rgba(15, 23, 42, 0.75);
    --text: #f8fafc;
    --text-secondary: #cbd5e1;
    --text-tertiary: #64748b;
    --border: rgba(255, 255, 255, 0.12);
    --accent: #00f2fe;
    --accent-soft: rgba(0, 242, 254, 0.12);
    --error: #ef4444;
    --error-soft: rgba(239, 68, 68, 0.15);

    --font-header: "Frank Ruhl Libre", Georgia, "Times New Roman", serif;
    --font-body: "Assistant", -apple-system, "Segoe UI", Arial, sans-serif;
    --font-mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    height: 100%;
  }

  body {
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    position: relative;
    overflow-x: hidden;
    background-image: 
      radial-gradient(circle at 10% 15%, rgba(168, 85, 247, 0.22) 0%, transparent 45%),
      radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.18) 0%, transparent 45%),
      radial-gradient(circle at 50% 30%, rgba(236, 72, 153, 0.15) 0%, transparent 50%);
  }

  /* Background Floating AI Icons */
  .bg-icons {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .ai-badge {
    position: absolute;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 7px 16px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(6px);
    opacity: 0.4;
    animation: float 8s infinite ease-in-out;
  }

  .icon-claude { top: 10%; right: 7%; color: #f59e0b; border-color: rgba(245, 158, 11, 0.4); }
  .icon-gemini { top: 22%; left: 5%; color: #3b82f6; border-color: rgba(59, 130, 246, 0.4); animation-delay: 1.5s; }
  .icon-gpt { top: 68%; right: 8%; color: #10b981; border-color: rgba(16, 185, 129, 0.4); animation-delay: 3s; }
  .icon-copilot { top: 78%; left: 7%; color: #ec4899; border-color: rgba(236, 72, 153, 0.4); animation-delay: 0.8s; }
  .icon-cursor { top: 42%; right: 4%; color: #a855f7; border-color: rgba(168, 85, 247, 0.4); animation-delay: 2.2s; }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-14px); }
  }

  .shell {
    width: 100%;
    max-width: 850px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    padding: 0 1.2rem;
    z-index: 1;
  }

  header {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 0.8rem;
    padding: 2rem 0 1rem;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    flex-shrink: 0;
    width: 72px;
    height: 72px;
    border-radius: 20px;
    overflow: hidden;
    background: var(--surface);
    border: 2px solid transparent;
    background: linear-gradient(var(--bg), var(--bg)) padding-box,
                linear-gradient(135deg, #00f2fe, #a855f7, #ec4899) border-box;
    box-shadow: 0 0 25px rgba(0, 242, 254, 0.35);
  }

  .logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .header-text h1 {
    font-size: 2.2rem;
    font-weight: 900;
    margin: 0 0 0.4rem;
    background: linear-gradient(135deg, #00f2fe, #a855f7, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.01em;
  }

  .header-text p {
    margin: 0;
    color: var(--text-secondary);
    font-size: 1.05rem;
    line-height: 1.5;
    max-width: 650px;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.8rem;
    padding: 1.5rem 0;
    justify-content: center;
  }

  .chip {
    font-family: var(--font-body);
    font-size: 0.9rem;
    font-weight: 600;
    color: #ffffff;
    background: rgba(15, 23, 42, 0.6);
    border: 1.5px solid rgba(255, 255, 255, 0.15);
    border-radius: 30px;
    padding: 0.65rem 1.25rem;
    cursor: pointer;
    text-align: right;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    line-height: 1.4;
    backdrop-filter: blur(12px);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
  }

  /* Soap Bubble Glowing Colors for Chips */
  .chip:nth-child(1) { border-color: rgba(0, 242, 254, 0.5); background: rgba(0, 242, 254, 0.12); }
  .chip:nth-child(1):hover { background: rgba(0, 242, 254, 0.25); box-shadow: 0 0 25px rgba(0, 242, 254, 0.5); }

  .chip:nth-child(2) { border-color: rgba(168, 85, 247, 0.5); background: rgba(168, 85, 247, 0.12); }
  .chip:nth-child(2):hover { background: rgba(168, 85, 247, 0.25); box-shadow: 0 0 25px rgba(168, 85, 247, 0.5); }

  .chip:nth-child(3) { border-color: rgba(16, 185, 129, 0.5); background: rgba(16, 185, 129, 0.12); }
  .chip:nth-child(3):hover { background: rgba(16, 185, 129, 0.25); box-shadow: 0 0 25px rgba(16, 185, 129, 0.5); }

  .chip:nth-child(4) { border-color: rgba(236, 72, 153, 0.5); background: rgba(236, 72, 153, 0.12); }
  .chip:nth-child(4):hover { background: rgba(236, 72, 153, 0.25); box-shadow: 0 0 25px rgba(236, 72, 153, 0.5); }

  .chip:nth-child(5) { border-color: rgba(245, 158, 11, 0.5); background: rgba(245, 158, 11, 0.12); }
  .chip:nth-child(5):hover { background: rgba(245, 158, 11, 0.25); box-shadow: 0 0 25px rgba(245, 158, 11, 0.5); }

  .chip:nth-child(6) { border-color: rgba(59, 130, 246, 0.5); background: rgba(59, 130, 246, 0.12); }
  .chip:nth-child(6):hover { background: rgba(59, 130, 246, 0.25); box-shadow: 0 0 25px rgba(59, 130, 246, 0.5); }

  .chip:hover {
    transform: translateY(-3px) scale(1.02);
    color: #ffffff;
  }

  .chip:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 0.5rem 0 1.2rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .msg { max-width: 100%; }

  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, rgba(0, 242, 254, 0.2), rgba(168, 85, 247, 0.2));
    color: #ffffff;
    border: 1px solid rgba(0, 242, 254, 0.4);
    border-radius: 20px 20px 4px 20px;
    padding: 0.85rem 1.3rem;
    max-width: 85%;
    font-size: 1rem;
    white-space: pre-wrap;
    word-wrap: break-word;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(12px);
  }

  .msg.assistant {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px 20px 20px 4px;
    padding: 1.2rem 1.5rem;
    font-size: 1.02rem;
    line-height: 1.7;
    animation: fade-in 0.3s ease;
    backdrop-filter: blur(16px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  }

  .msg.assistant p {
    margin: 0 0 1rem;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .msg.assistant p:last-child { margin-bottom: 0; }

  .msg.system {
    color: var(--error);
    background: var(--error-soft);
    border: 1px solid var(--error);
    border-radius: 14px;
    padding: 0.8rem 1.2rem;
    font-size: 0.95rem;
    align-self: stretch;
  }

  .quote {
    border-inline-start: 4px solid var(--accent);
    background: var(--accent-soft);
    padding: 1rem 1.2rem;
    margin: 1rem 0;
    font-size: 1.05em;
    line-height: 1.7;
    border-radius: 8px;
    font-style: italic;
  }

  .inline-quote { color: var(--accent); font-weight: 600; }

  @keyframes fade-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .typing {
    display: flex;
    gap: 0.4rem;
    padding: 0.6rem 0.5rem;
  }

  .typing span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    animation: bounce 1.2s infinite ease-in-out;
  }

  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-8px); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .msg.assistant { animation: none; }
    .typing span { animation: none; opacity: 0.7; }
  }

  form {
    display: flex;
    gap: 0.8rem;
    align-items: center;
    padding: 1rem 0 1.2rem;
    border-top: 1px solid var(--border);
    background: transparent;
  }

  textarea {
    flex: 1;
    resize: none;
    font-family: var(--font-body);
    font-size: 1.02rem;
    line-height: 1.5;
    color: var(--text);
    background: rgba(15, 23, 42, 0.85);
    border: 1.5px solid rgba(0, 242, 254, 0.3);
    border-radius: 30px;
    padding: 0.75rem 1.3rem;
    max-height: 8.5rem;
    min-height: 3.1rem;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(16px);
  }

  textarea:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 18px rgba(0, 242, 254, 0.35);
  }

  button[type="submit"] {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 1rem;
    color: #ffffff;
    background: linear-gradient(135deg, #00f2fe, #a855f7, #ec4899);
    border: none;
    border-radius: 30px;
    padding: 0.75rem 1.6rem;
    cursor: pointer;
    height: 3.1rem;
    box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
    transition: all 0.3s ease;
  }

  button[type="submit"]:hover {
    box-shadow: 0 0 25px rgba(236, 72, 153, 0.6);
    transform: scale(1.04);
  }

  button[type="submit"]:disabled {
    opacity: 0.4;
    cursor: default;
    transform: none;
    box-shadow: none;
  }

  button[type="submit"]:focus-visible {
    outline: 2px solid var(--text);
    outline-offset: 2px;
  }

  .hint {
    text-align: center;
    color: var(--text-tertiary);
    font-family: var(--font-mono);
    font-size: 0.75rem;
    padding-bottom: 0.8rem;
  }

  @media (max-width: 480px) {
    .shell { padding: 0 0.9rem; }
    .logo { width: 60px; height: 60px; }
    .header-text h1 { font-size: 1.7rem; }
    .msg.user { max-width: 92%; }
    .chips { gap: 0.6rem; }
    .chip { font-size: 0.82rem; padding: 0.55rem 0.95rem; }
  }
</style>
</head>
<body>

  <!-- Floating Background AI Badges -->
  <div class="bg-icons">
    <div class="ai-badge icon-claude">✦ Claude</div>
    <div class="ai-badge icon-gemini">❖ Gemini</div>
    <div class="ai-badge icon-gpt">⎔ ChatGPT</div>
    <div class="ai-badge icon-copilot">◈ Copilot</div>
    <div class="ai-badge icon-cursor">⚡ Cursor</div>
  </div>

  <div class="shell">
    <header>
      <div class="logo">
        <img src="/logo.jpg" alt="חנה" width="72" height="72">
      </div>
      <div class="header-text">
        <h1>היי, אני קולגת ה-AI של חנה</h1>
        <p>אני מבוסס על איסוף דאטה ומקרי בוחן אמיתיים מעבודת ה-AI של חנה בשנה וחצי האחרונות. שאלו אותי כל דבר.</p>
      </div>
    </header>

    <div class="chips" id="chips">
      <button class="chip" type="button">איך היא מתמודדת עם באג שלא מובן?</button>
      <button class="chip" type="button">כמה עמוק היא באמת חושבת? תן לי את הרגע הכי אינטלקטואלי.</button>
      <button class="chip" type="button">איך היא מתקרבת לעיצוב ארכיטקטורה של מערכת?</button>
      <button class="chip" type="button">היא עבדה עם AI agents — איך היא מתמודדת עם אי-ודאות?</button>
      <button class="chip" type="button">מה הגישה שלה לבעיות performance?</button>
      <button class="chip" type="button">מה החולשות שלה?</button>
    </div>

    <main id="chat" aria-live="polite"></main>

    <form id="form">
      <textarea id="input" rows="1" placeholder="שאלו משהו על חנה…" maxlength="600" aria-label="שאלה"></textarea>
      <button type="submit" id="send">שליחה</button>
    </form>
    <div class="hint">Enter לשליחה · Shift+Enter לשורה חדשה</div>
  </div>

<script>
(function () {
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const chips = document.getElementById("chips");

  let history = [];
  let busy = false;

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function inline(line) {
    let s = escapeHtml(line);
    s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/([\"“„][^\"”]{2,}[\"”])/g, '<span class="inline-quote">$1</span>');
    return s;
  }

  function renderAnswer(raw) {
    const lines = raw.split("\n");
    let html = "";
    let quoteBuf = [];
    let paraBuf = [];
    function flushQuote() {
      if (quoteBuf.length) {
        html += '<div class="quote">' + quoteBuf.map(inline).join("<br>") + "</div>";
        quoteBuf = [];
      }
    }
    function flushPara() {
      if (paraBuf.length) {
        html += "<p>" + paraBuf.map(inline).join("<br>") + "</p>";
        paraBuf = [];
      }
    }
    for (const line of lines) {
      const m = line.match(/^>\s?(.*)$/);
      if (m) {
        flushPara();
        quoteBuf.push(m[1]);
      } else if (line.trim() === "") {
        flushQuote();
        flushPara();
      } else {
        flushQuote();
        paraBuf.push(line);
      }
    }
    flushQuote();
    flushPara();
    return html;
  }

  function scrollToBottom() {
    chat.scrollTop = chat.scrollHeight;
  }

  function addUserMessage(text) {
    const el = document.createElement("div");
    el.className = "msg user";
    el.textContent = text;
    chat.appendChild(el);
    scrollToBottom();
  }

  function addSystemMessage(text) {
    const el = document.createElement("div");
    el.className = "msg system";
    el.textContent = text;
    chat.appendChild(el);
    scrollToBottom();
  }

  function addTyping() {
    const el = document.createElement("div");
    el.className = "typing";
    el.id = "typing-indicator";
    el.innerHTML = "<span></span><span></span><span></span>";
    chat.appendChild(el);
    scrollToBottom();
    return el;
  }

  function setBusy(v) {
    busy = v;
    sendBtn.disabled = v;
    input.disabled = v;
    Array.from(chips.children).forEach((c) => (c.disabled = v));
  }

  async function ask(question) {
    if (busy) return;
    setBusy(true);
    addUserMessage(question);

    const typingEl = addTyping();
    let assistantEl = null;
    let acc = "";

    try {
      const res = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, history }),
      });

      if (!res.ok) {
        typingEl.remove();
        let message = "משהו השתבש. נסו שוב בעוד רגע.";
        try {
          const data = await res.json();
          if (data && data.error) message = data.error;
        } catch {}
        addSystemMessage(message);
        setBusy(false);
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let first = true;

      function appendChunk(chunk) {
        if (!chunk) return;
        if (first) {
          typingEl.remove();
          assistantEl = document.createElement("div");
          assistantEl.className = "msg assistant";
          chat.appendChild(assistantEl);
          first = false;
        }
        acc += chunk;
        assistantEl.innerHTML = renderAnswer(acc);
        scrollToBottom();
      }

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        appendChunk(decoder.decode(value, { stream: true }));
      }
      appendChunk(decoder.decode()); // flush trailing multi-byte tail

      if (first) {
        typingEl.remove();
      }

      if (acc.trim()) {
        history.push({ role: "user", content: question });
        history.push({ role: "assistant", content: acc });
        history = history.slice(-16);
      }
    } catch (err) {
      typingEl.remove();
      addSystemMessage("לא הצלחנו להתחבר כרגע. בדקו חיבור ונסו שוב.");
    } finally {
      setBusy(false);
      input.focus();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || busy) return;
    input.value = "";
    input.style.height = "auto";
    ask(text);
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 136) + "px";
  });

  chips.addEventListener("click", (e) => {
    const btn = e.target.closest(".chip");
    if (!btn || busy) return;
    ask(btn.textContent);
  });
})();
</script>
</body>
</html>
